<?xml version="1.0" encoding="UTF-8"?>
<!-- App Icon Preview project for Dailies (not installed). App Icon Preview exports the area of #hicolor as
     the app icon (and, with its stripes overlay, the Devel icon) and the area of #symbolic as the symbolic icon. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="192" height="152" viewBox="0 0 192 152">
  <g id="layer4" inkscape:groupmode="layer" inkscape:label="template">
    <rect id="hicolor" x="8" y="16" width="128" height="128" fill="none"/>
    <rect id="symbolic" x="168" y="16" width="16" height="16" fill="none"/>
  </g>
  <g id="layer1" inkscape:groupmode="layer" inkscape:label="App Icon">
    <g id="app-icon" transform="translate(8 16)">
      <!-- Front profile (Light 4): same torn outline, 8 px lower -->
      <path d="M12 28l6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6V108a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8z" fill="#c0bfbc"/>
      <!-- Page face (Light 2) with a torn top edge -->
      <path d="M12 20l6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6 6.5-6 6.5 6V100a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8z" fill="#f6f5f4"/>
      <!-- Row 1: miss, present, miss -->
      <rect x="28" y="28" width="20" height="20" rx="3" fill="#c0bfbc"/>
      <rect x="54" y="28" width="20" height="20" rx="3" fill="#ff7800"/>
      <rect x="80" y="28" width="20" height="20" rx="3" fill="#c0bfbc"/>
      <!-- Row 2: present, correct, miss -->
      <rect x="28" y="54" width="20" height="20" rx="3" fill="#ff7800"/>
      <rect x="54" y="54" width="20" height="20" rx="3" fill="#1c71d8"/>
      <rect x="80" y="54" width="20" height="20" rx="3" fill="#c0bfbc"/>
      <!-- Row 3: solved -->
      <rect x="28" y="80" width="20" height="20" rx="3" fill="#1c71d8"/>
      <rect x="54" y="80" width="20" height="20" rx="3" fill="#1c71d8"/>
      <rect x="80" y="80" width="20" height="20" rx="3" fill="#1c71d8"/>
    </g>
    <g id="app-icon-symbolic" transform="translate(168 16)" fill="#222222">
      <!-- The torn page: the torn edge on top, the 3x3 guess grid cut out as 2 px tiles with 2 px gaps -->
      <path fill-rule="evenodd" d="M1 3l1.75-2 1.75 2 1.75-2 1.75 2 1.75-2 1.75 2 1.75-2 1.75 2V13a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z
        M3 4h2v2H3zM7 4h2v2H7zM11 4h2v2H11z
        M3 8h2v2H3zM7 8h2v2H7zM11 8h2v2H11z
        M3 12h2v2H3zM7 12h2v2H7zM11 12h2v2H11z"/>
    </g>
  </g>
</svg>
