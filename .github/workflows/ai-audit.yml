name: AI audit trail

# Audit trail of agent work (#311): every pull request merged into main in the
# reporting window, attributed to its source (a Hive agent and model from the
# PR's signature, Claude Code in CI, Dependabot, or other), with who opened it
# and who merged it. Computed by scripts/ai-audit-report.sh. The weekly run
# covers the past 7 days, so consecutive runs leave no gap. Results land in the
# run's job summary and, with the raw PR data, in the ai-audit artifact.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: Reporting window in days
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  audit:
    name: AI audit trail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: read for the checkout of scripts/; pull-requests: read for `gh pr list`.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the audit trail
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "::error::days must be a whole number, got '$DAYS'"; exit 1; }
          since="$(date -u -d "${DAYS} days ago" +%Y-%m-%d)"
          gh pr list --repo "$REPO" --base main --state merged --limit 1000 \
            --search "merged:>=${since}" \
            --json number,title,author,headRefName,mergedAt,mergedBy,body > ai-audit-prs.json
          scripts/ai-audit-report.sh --since "$since" < ai-audit-prs.json > ai-audit.md
          cat ai-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the audit trail
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-audit
          path: |
            ai-audit.md
            ai-audit-prs.json
          retention-days: 90
