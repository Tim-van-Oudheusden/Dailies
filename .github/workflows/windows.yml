name: Windows (experimental)

# The experimental Windows build (#84): MSYS2 UCRT64, as Cartridges builds it (docs/research/stack-crossplatform.md,
# Appendix A.3). It never blocks a merge: the job is continue-on-error, and the main ruleset does not require it. The
# bundled tree and its installer are CI artifacts only, never GitHub Release assets, until someone has tried them on
# real hardware.
# CONTRIBUTING.md, "Experimental Windows build", says what differs from Linux.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR: a new push cancels the superseded run. Pushes to main get a per-commit group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (experimental)
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    env:
      # Blueprint's and Meson's Python reads the sources as UTF-8, not the runner's ANSI code page.
      PYTHONUTF8: "1"
      # The windows-2025 image no longer ships Inno Setup (actions/runner-images#11644), so the job downloads it. The
      # SHA-256 matches the digest GitHub lists for the release asset.
      INNOSETUP_VERSION: 7.1.0
      INNOSETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # MSYS2's blueprint-compiler is older than meson.build asks for, and its Python package shadows the wrap's, so
      # it stays uninstalled; git fetches the wrap.
      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-desktop-file-utils
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-glib-networking
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-libsoup3
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
      # The wrap's uninstalled blueprint-compiler imports its package from the source tree, which is not on sys.path.
      - name: Build and install
        run: |
          pacman -Q mingw-w64-ucrt-x86_64-{gtk4,libadwaita,python,python-gobject}
          echo "BUNDLE=$(cygpath -m "$RUNNER_TEMP/Dailies")" >> "$GITHUB_ENV"
          meson setup _build --prefix="$(cygpath -m "$RUNNER_TEMP/Dailies")"
          PYTHONPATH=$(cygpath -m "$PWD/subprojects/blueprint-compiler") meson install -C _build
      # Not run here: icons and fetcher decode with glycin, which MSYS2 ships without typelibs or loaders (the app shows
      # no icons on Windows); dialogs and the e2e smoke test need gtk4-broadwayd and dbus-run-session, which MSYS2 does
      # not have. smoke.ps1 below starts the app instead.
      - name: Meson tests
        run: >-
          meson test -C _build --print-errorlogs
          "Validate desktop file" "Validate schema file" "Template is up to date" "Bundled icons resolve"
          favorites done_today store filters translations
      - name: Bundle the runtime
        run: build-aux/windows/bundle.sh "$BUNDLE"
      # Moved first, so a path the build baked in fails here instead of on a user's machine.
      - name: Start the moved bundle without MSYS2
        shell: pwsh
        run: |
          Copy-Item -Recurse $env:BUNDLE (Join-Path $env:RUNNER_TEMP 'moved')
          build-aux/windows/smoke.ps1 -App (Join-Path $env:RUNNER_TEMP 'moved') -Screenshots (Join-Path $env:RUNNER_TEMP 'screenshots')
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dailies-windows-x86_64-experimental
          path: ${{ env.BUNDLE }}
      # The installer (#242) packs the same tree; Meson wrote its script, Dailies.iss, into the build directory. Inno
      # Setup's own installer is a release binary pinned by SHA-256, as Static checks gets shellcheck.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "innosetup-$env:INNOSETUP_VERSION-x64.exe"
          $tag = 'is-' + $env:INNOSETUP_VERSION.Replace('.', '_')
          $installer = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -OutFile $installer "https://github.com/jrsoftware/issrc/releases/download/$tag/$name"
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne $env:INNOSETUP_SHA256) { throw "${name}: SHA-256 mismatch" }
          $setup = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$env:RUNNER_TEMP\InnoSetup`"")
          if ($setup.ExitCode -ne 0) { throw "$name exited with $($setup.ExitCode)" }
      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\InnoSetup\ISCC.exe" /Q "/O$env:RUNNER_TEMP\installer" _build\build-aux\windows\Dailies.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
      - name: Install, start and uninstall
        shell: pwsh
        run: |
          $installer = (Get-Item "$env:RUNNER_TEMP\installer\*.exe").FullName
          build-aux/windows/install-smoke.ps1 -Installer $installer -Dir (Join-Path $env:RUNNER_TEMP 'installed')
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dailies-windows-x86_64-experimental-installer
          path: ${{ runner.temp }}/installer
          if-no-files-found: error
