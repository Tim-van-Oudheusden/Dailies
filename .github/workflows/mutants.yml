name: Mutants report

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Mutants report
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Publishes the report to the job summary and as an artifact; nothing is committed. The proposed baseline is an
    # artifact a maintainer reviews and commits by hand (docs/testing.md#python-mutants). Not a required check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install gate tools
        run: |
          python -m pip install --require-hashes -r scripts/requirements.txt
          python -m pip install mutmut==3.8.1 pytest==9.1.1
      - name: Generate mutants report
        id: report
        # New survivors and a failed run are for a maintainer to read: they leave a warning, not a red run on main.
        continue-on-error: true
        run: scripts/mutants_report.py --write > mutants-report.md
      - name: Flag a report that did not pass
        if: steps.report.outcome == 'failure'
        run: echo "::warning title=Mutants report::new survivors or a failed mutmut run, see the job summary"
      - name: Publish job summary
        if: always()
        run: cat mutants-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-report
          path: mutants-report.md
          retention-days: 90
      - name: Upload proposed baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-baseline
          path: .github/mutants-baseline.json
          retention-days: 90
