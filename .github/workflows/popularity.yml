name: Weekly popularity

# Every Monday: collect the Tranco ranks of every active game's domain and the Wikipedia pageviews of the games with an
# article (method_version 3), compute the Popular and Trending shelves deterministically, validate them against the
# schema, let Claude write the weekly report (issue #66) and open a pull request. Fails closed: when Tranco failed for
# too many domains, compute.py exits non-zero, nothing is published and data/v1/popularity.json stays as it is. The
# model writes prose only: a guard fails the job if it changed anything but docs/popularity/<week>.md, and a failed
# report never blocks the numbers. A maintainer merges the PR; main is protected.
# Scheduled workflows in public repositories are disabled after 60 days without activity; re-enable this one from
# the Actions tab (docs/runbooks/re-enable-cron.md).

on:
  schedule:
    # Monday 04:17 UTC: off the hour, when GitHub's scheduler is least loaded.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      narrate:
        description: Write the Claude report (always on for the schedule)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time; a run that is publishing is never cancelled.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compute:
    name: Collect and compute
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      week: ${{ steps.week.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # requests for the collector, jsonschema for compute.py, check-jsonschema for the validation step.
      - name: Install script dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt
      # Exits 0 whenever the raw files were written; deciding whether the week is usable is compute.py's job. HN (--hn)
      # stays off: its title search matched about 2 relevant stories of 64 across the catalog (#103). Radar (--radar)
      # waits for a CLOUDFLARE_RADAR_TOKEN secret.
      - name: Collect Tranco ranks and Wikipedia pageviews
        run: >-
          python -I scripts/popularity/collect.py --catalog data/v1/games.json --out "$RUNNER_TEMP/raw/"
          --wikipedia
      # Reads last week's file for the history; exits 1 and writes nothing when Tranco failed for > 20 % of domains.
      - name: Compute shelves
        run: >-
          python -I scripts/popularity/compute.py --catalog data/v1/games.json --raw "$RUNNER_TEMP/raw/"
          --previous data/v1/popularity.json --out "$RUNNER_TEMP/result/popularity.json"
          --summary "$RUNNER_TEMP/result/summary.json"
      - name: Validate against the schema
        run: check-jsonschema --schemafile data/v1/schema/popularity.schema.json "$RUNNER_TEMP/result/popularity.json"
      - name: Write the pull-request body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -I scripts/popularity/pr_body.py --summary "$RUNNER_TEMP/result/summary.json"
          --out "$RUNNER_TEMP/result/pr-body.md" --run-url "$RUN_URL"
      # The schema pins week to ^\d{4}-W\d{2}$, so the value is safe to use in the PR title.
      - name: Read the ISO week
        id: week
        run: echo "week=$(jq -r .week "$RUNNER_TEMP/result/popularity.json")" >> "$GITHUB_OUTPUT"
      # Kept for audits even when compute failed closed.
      - name: Upload raw signals
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: popularity-raw
          path: |
            ${{ runner.temp }}/raw/
            ${{ runner.temp }}/result/summary.json
          retention-days: 90
      - name: Upload the result for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: popularity-result
          path: ${{ runner.temp }}/result/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Write the report and open the data pull request
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    env:
      WEEK: ${{ needs.compute.outputs.week }}
    steps:
      # create-pull-request configures its own token for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: popularity-result
          path: ${{ runner.temp }}/result
      - name: Put popularity.json in place
        run: cp "$RUNNER_TEMP/result/popularity.json" data/v1/popularity.json
      # Taken before the model runs: the guard runs from this copy, and .git/config is restored from it afterwards
      # (claude-code-action writes its token into the remote URL; a changed config could make git run a command).
      - name: Keep trusted copies of the guard and the git config
        run: |
          mkdir "$RUNNER_TEMP/trusted"
          cp scripts/popularity/report_guard.py .git/config "$RUNNER_TEMP/trusted/"
      # The model's only inputs: numbers and maintainer-approved game names. It never sees issue text or fetched HTML.
      - name: Stage the report inputs
        if: github.event_name == 'schedule' || inputs.narrate
        run: cp "$RUNNER_TEMP/result/summary.json" summary.json
      # Write path rules are never consulted and a bare Write would allow writes anywhere on the runner, so the one
      # file the model may create is granted as an Edit rule (Edit rules cover every file-writing tool). Reads stay
      # inside the checkout; anything else is denied, because a headless session cannot ask.
      - name: Write the weekly report with Claude
        id: narrate
        if: github.event_name == 'schedule' || inputs.narrate
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            You write the weekly popularity report for Dailies, a launcher for daily guessing games. Read summary.json
            and data/v1/popularity.json. Write docs/popularity/${{ needs.compute.outputs.week }}.md, in English and
            about 400 words of plain Markdown without emoji, starting with the heading
            "# Popularity report ${{ needs.compute.outputs.week }}" and then these sections: Overview (3 to 5
            sentences), a Popular table, a Trending table, Movers (the biggest rises and falls), and Data quality
            (source health and carried-forward domains). Use only numbers present in the inputs; do not round, compute
            or guess new ones, and do not speculate about causes the data does not show. Do not edit any other file.
          claude_args: >-
            --max-turns 6
            --allowedTools "Edit(/docs/popularity/${{ needs.compute.outputs.week }}.md)"
            --disallowedTools "Bash,NotebookEdit,WebSearch,WebFetch,mcp__*"
      - name: Remove the report inputs and restore the git config
        run: |
          rm -f summary.json
          cp "$RUNNER_TEMP/trusted/config" .git/config
      # Downloaded again after the model ran, so the reference cannot have been touched.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: popularity-result
          path: ${{ runner.temp }}/reference
      # Only the shelves (byte-identical to the compute artifact) and the week's report may change; on success the
      # report, if written, is linked from popularity.json.
      - name: Guard the changed paths and link the report
        run: >-
          python3 -I "$RUNNER_TEMP/trusted/report_guard.py" --week "$WEEK"
          --reference "$RUNNER_TEMP/reference/popularity.json" --git-config "$RUNNER_TEMP/trusted/config"
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/popularity
          delete-branch: true
          # docs/popularity/ always exists (README.md), so the pathspec matches even in a week without a report.
          add-paths: |
            data/v1/popularity.json
            docs/popularity/
          commit-message: "data(popularity): week ${{ needs.compute.outputs.week }}"
          title: "data(popularity): week ${{ needs.compute.outputs.week }}"
          body-path: ${{ runner.temp }}/reference/pr-body.md
          labels: |
            data
            automated
