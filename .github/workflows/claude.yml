name: Claude Code

# Hands an issue to Claude Code when a maintainer labels it `ai-fix-requested`
# (a label applied by a bot or GitHub App is skipped, #278), or when a trusted
# collaborator mentions @claude on an issue or PR. Claude works on a `claude/*`
# branch and opens a PR; it never pushes to main.
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret and the Claude GitHub App.
# See CONTRIBUTING.md "Handing work to Claude Code" and docs/security/SECURITY-AI.md.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  # A newer event in a busy group replaces the pending one, and the group is
  # resolved before the job's `if`. Only events that pass that `if` share the
  # per-issue queue. Any other label, comment or review gets a group of its
  # own, so it cannot cancel a pending run that was really asked for.
  group: >-
    claude-${{ github.event.issue.number || github.event.pull_request.number }}-${{
    ((github.event.label.name == 'ai-fix-requested' && github.event.sender.type == 'User')
    || (contains(format('{0}{1}', github.event.comment.body, github.event.review.body), '@claude')
    && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)))
    && 'queue' || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude Code
    # Labels can only be applied by triagers, and only a person's label counts:
    # claude-code-action refuses a bot sender (hive-forge-app files issues with
    # `ai-fix-requested`), so that run would only fail (#278). Mentions are
    # limited to people with write access so outside commenters cannot spend
    # runs or steer them.
    if: >-
      (github.event_name == 'issues'
        && github.event.label.name == 'ai-fix-requested'
        && github.event.sender.type == 'User')
      || (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The minimum claude-code-action documents: push the claude/* branch, open
    # and comment on PRs, comment on issues, and mint its GitHub App token via OIDC.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Refuse fork pull requests
        # claude-code-action checks out the PR head (fork PRs via refs/pull/N/head)
        # and Claude may run ruff, pytest or meson on it while this job holds a
        # write token. Fork code must never run here.
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          head_repo="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')"
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::Fork pull requests are not supported by the Claude workflow; review them locally."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The core tests are pure Python, so no python3-gi; the Flatpak build and
      # the gi tests are left to CI. Script dependencies come from the
      # hash-pinned lock (tests/scripts imports them); the dev tools are pinned
      # to the versions in ci.yml.
      - name: Install toolchain
        run: |
          python -m pip install --require-hashes -r scripts/requirements.txt
          python -m pip install ruff==0.17.1 pytest==9.1.1 pytest-cov==7.1.0
      - name: Run Claude Code
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: ai-fix-requested
          trigger_phrase: '@claude'
          branch_prefix: claude/
          claude_args: >-
            --allowedTools "Bash(meson *),Bash(ninja *),Bash(pytest *),Bash(ruff *),Bash(flatpak-builder *),Bash(blueprint-compiler *)"
