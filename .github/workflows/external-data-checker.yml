name: Check for Flatpak dependency updates

# Bazaar's flatpak-external-data-checker workflow at a weekly cadence. The checker
# reads the x-checker-data of the release manifest's git source; when a newer v*
# tag exists it commits the bumped tag and commit to a branch and opens a pull
# request against main. With nothing to update the run is a no-op. Until the first
# v* tag exists the run fails: the checker finds no tag to compare against.
# Dependabot and Renovate have no Flatpak-manifest manager, hence this workflow.
# See CONTRIBUTING.md, "Cutting a release", step 6.

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatched run and the scheduled run never race on the same update branch.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    name: Flatpak external data checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write pushes the update branch; pull-requests: write opens the PR.
    # The checker pushes with GITHUB_TOKEN itself, so checkout keeps no credentials.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Pinned by digest: ghcr.io/flathub/flatpak-external-data-checker:latest as of 2026-10-16.
      # Dependabot does not update docker:// references, so refresh this digest by hand.
      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:58cbad601261c2ebaae2e18b6f639c09aa5809ef941dcff7284f68928ebb790d
        env:
          GIT_AUTHOR_NAME: Flatpak External Data Checker
          GIT_COMMITTER_NAME: Flatpak External Data Checker
          # This email shows the commits as authored by github-actions[bot].
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork --require-important-update build-aux/flatpak/io.github.tim_van_oudheusden.Dailies.json
