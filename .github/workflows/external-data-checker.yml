name: Check for Flatpak dependency updates

# Bazaar's flatpak-external-data-checker workflow at a weekly cadence. The checker
# reads the x-checker-data of the release manifest's git source; when a newer v*
# tag exists it writes the bumped tag and commit into the manifest, and
# create-pull-request commits that to a branch and opens a pull request against
# main. With nothing to update the run is a no-op. Until the first v* tag exists
# the run fails: the checker finds no tag to compare against.
# Dependabot and Renovate have no Flatpak-manifest manager, hence this workflow.
# See CONTRIBUTING.md, "Cutting a release", step 6.

on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A dispatched run and the scheduled run never race on the same update branch.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    name: Flatpak external data checker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write pushes the update branch; pull-requests: write opens the PR.
    # create-pull-request authenticates with GITHUB_TOKEN itself, so checkout keeps
    # no credentials.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Pinned by digest: ghcr.io/flathub/flatpak-external-data-checker:latest as of 2026-10-29.
      # Dependabot does not update docker:// references; the nightly compliance row
      # "External data checker image is :latest" reports a newer :latest, and
      # CONTRIBUTING.md, "Dependencies", describes the bump.
      # --edit-only: the checker only edits the manifest and is never given the
      # GITHUB_TOKEN; create-pull-request pushes the branch and opens the pull request (#200).
      # Images before 2026-10-29 pushed to https://TOKEN:x-oauth-basic@github.com/...,
      # which GitHub refuses for the GITHUB_TOKEN installation token.
      - uses: docker://ghcr.io/flathub/flatpak-external-data-checker@sha256:f362ad088473d2c791e8b51185d30b806b962a98a4ee1bbf5b59cf242130728a
        with:
          args: --edit-only --require-important-update build-aux/flatpak/io.github.tim_van_oudheusden.Dailies.json
      - name: Read the proposed tag
        id: tag
        run: >-
          jq -r '.modules[] | objects | select(.name == "dailies") | .sources[]
          | select(has("x-checker-data")) | "tag=" + (.tag // "")'
          build-aux/flatpak/io.github.tim_van_oudheusden.Dailies.json >> "$GITHUB_OUTPUT"
      # A pull request opened with GITHUB_TOKEN starts no CI; CONTRIBUTING.md, step 6,
      # says to close and reopen it.
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: flatpak/external-data
          delete-branch: true
          add-paths: build-aux/flatpak/io.github.tim_van_oudheusden.Dailies.json
          commit-message: "build(flatpak): pin release manifest to ${{ steps.tag.outputs.tag }}"
          title: "build(flatpak): pin release manifest to ${{ steps.tag.outputs.tag }}"
          body: |
            The weekly flatpak-external-data-checker run found the `${{ steps.tag.outputs.tag }}` tag and pinned the release manifest's `dailies` source to its `tag` and `commit`.

            Close and reopen this pull request to run the required checks (CONTRIBUTING.md, "Cutting a release", step 6).
          labels: |
            flatpak
            automated
