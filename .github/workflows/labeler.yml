name: Labeler

# Applies path-based labels from .github/labeler.yml to pull requests.
# pull_request_target runs against the base branch's config so fork PRs can be
# labelled too; the job never checks out PR code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read .github/labeler.yml and label the pull request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        # Path labels are a convenience. A failed GitHub API call must not turn this
        # check red: the merge queue only takes pull requests in merge state CLEAN.
        continue-on-error: true
