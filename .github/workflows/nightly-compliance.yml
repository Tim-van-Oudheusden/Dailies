name: Nightly compliance

# Checks that can go stale without a code change: new Dependabot alerts, new
# advisories against the CI scripts' pinned Python packages, the GNOME runtime
# reaching end-of-life on Flathub, the ACMM file layout Hive evaluates, a
# flatpak-external-data-checker :latest that has stayed unpinned for 10 days
# and, on Sundays (or when a manual run sets force_links), every active catalog
# link. scripts/nightly-compliance.sh lists the checks; results land in the
# run's job summary and as the nightly-compliance artifact.
#
# On main the link check keeps its weekly streaks in the link-check-state
# artifact (90 days; each weekly run uploads a fresh one) and, when a game
# should become broken, active again or retired, the link-status job opens a
# data/link-status pull request (issue #81). A lost or expired artifact only
# restarts the streaks; it never changes a status. A maintainer merges.
#
# On main the checker-pin job moves the flatpak-external-data-checker pin once
# its :latest is 3 days old and opens the ci/checker-pin pull request (#269).

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force_links:
        description: Check the catalog links even if it is not Sunday
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One run at a time, so two runs never read and write the link-check state at once.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compliance:
    name: Nightly compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # vulnerability-alerts: read lets the GITHUB_TOKEN list Dependabot alerts;
    # issues: write lets the link check open or update its `data` issue;
    # actions: read lets it download the last link-check-state artifact.
    permissions:
      actions: read
      contents: read
      issues: write
      vulnerability-alerts: read
    outputs:
      status-changes: ${{ steps.status.outputs.changes }}
      priority: ${{ steps.status.outputs.priority }}
      week: ${{ steps.status.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The setup steps may fail without stopping the job: the script then reports the
      # check that needed them as failed, and still runs every other check.
      - name: Install script dependencies
        continue-on-error: true
        run: python -m pip install --require-hashes -r scripts/requirements.txt
      - name: Install Flatpak and the Flathub remote
        continue-on-error: true
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      # The newest link-check-state artifact holds last week's streaks; without one
      # (the first run, or it expired) the link check starts them over.
      - name: Download the previous link-check state
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=link-check-state&per_page=1" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n link-check-state -D "$RUNNER_TEMP/link-state-previous"
          fi
      - name: Run compliance checks
        env:
          GH_TOKEN: ${{ github.token }}
          DAILIES_FORCE_LINKS: ${{ inputs.force_links && '1' || '0' }}
          LINKS_PREVIOUS_STATE: ${{ runner.temp }}/link-state-previous/state.json
          LINKS_STATUS_DIR: ${{ runner.temp }}/link-status
        run: scripts/nightly-compliance.sh > nightly-compliance.md
      - name: Publish job summary
        if: always()
        run: cat nightly-compliance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-compliance
          path: nightly-compliance.md
      # Written only when the link check ran (Sundays or forced).
      - name: Upload the link-check state
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-check-state
          path: ${{ runner.temp }}/link-status/state.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload the status changes
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: link-status-changes
          path: |
            ${{ runner.temp }}/link-status/changes.json
            ${{ runner.temp }}/link-status/pr-body.md
          if-no-files-found: ignore
          retention-days: 7
      # A failing link check fails this job, which is exactly when a status may change.
      - name: Read the status changes
        id: status
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          changes="$RUNNER_TEMP/link-status/changes.json"
          if [ -f "$changes" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "week=$(jq -r .week "$changes")" >> "$GITHUB_OUTPUT"
            if jq -e 'any(.changes[]; .status == "retired")' "$changes" > /dev/null; then
              echo "priority=priority::high" >> "$GITHUB_OUTPUT"
            fi
          fi

  link-status:
    name: Open the link-status pull request
    needs: compliance
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.compliance.outputs.status-changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # create-pull-request configures its own token for the push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: link-status-changes
          path: ${{ runner.temp }}/link-status
      # Applied to the newest main, so catalog changes merged since the check are kept. Stdlib only.
      - name: Apply the status changes
        run: >-
          python -I scripts/apply_link_status.py --changes "$RUNNER_TEMP/link-status/changes.json"
          --catalog data/v1/games.json
      # Only the catalog may change.
      - name: Guard the changed paths
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r line; do
            path=${line:3}
            case "$path" in
              data/v1/games.json) ;;
              *)
                echo "::error::Unexpected change: $path"
                status=1
                ;;
            esac
          done < <(git status --porcelain --untracked-files=all)
          exit "$status"
      # The week comes from changes.json, which pins it to the ISO week format.
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/link-status
          delete-branch: true
          add-paths: data/v1/games.json
          commit-message: "data(links): update game status (week ${{ needs.compliance.outputs.week }})"
          title: "data(links): update game status (week ${{ needs.compliance.outputs.week }})"
          body-path: ${{ runner.temp }}/link-status/pr-body.md
          labels: |
            data
            automated
            ${{ needs.compliance.outputs.priority }}

  checker-pin:
    name: Open the checker pin pull request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The bot environment holds the self-created GitHub App's ID and key and only
    # main may use it (#269). Its token can push the workflow change, which the
    # GITHUB_TOKEN cannot, and its pull requests start CI. deployment: false keeps
    # the daily run out of the deployment history. The GITHUB_TOKEN stays read-only.
    environment:
      name: bot
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stdlib only. Does nothing until :latest is 3 days old, so a burst of
      # upstream pushes gives one pull request.
      - name: Move the pin once :latest has settled
        run: python3 -I scripts/check_checker_digest.py --bump --pr-body "$RUNNER_TEMP/checker-pin.md"
      # Only the pinned workflow may change.
      - name: Guard the changed paths
        id: changed
        run: |
          set -euo pipefail
          changed=false
          while IFS= read -r line; do
            path=${line:3}
            case "$path" in
              .github/workflows/external-data-checker.yml) changed=true ;;
              *)
                echo "::error::Unexpected change: $path"
                exit 1
                ;;
            esac
          done < <(git status --porcelain --untracked-files=all)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # A one-hour installation token with only the permissions the pull request
      # needs. client-id takes the App ID as well as the Client ID.
      - name: Create the bot token
        id: bot
        if: steps.changed.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Create pull request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.bot.outputs.token }}
          branch: ci/checker-pin
          delete-branch: true
          add-paths: .github/workflows/external-data-checker.yml
          commit-message: "ci(flatpak): bump the flatpak-external-data-checker digest"
          title: "ci(flatpak): bump the flatpak-external-data-checker digest"
          body-path: ${{ runner.temp }}/checker-pin.md
          labels: |
            ci
            automated
