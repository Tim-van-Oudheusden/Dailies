# Path-based PR labels, applied by .github/workflows/labeler.yml (actions/labeler).
# The labels name the area a PR touches; its risk tier comes from .github/policies/risk-tiers.policy.
# Every path the policy names gets a label and every labelled path has a policy rule, apart from the exemptions
# listed with their reasons in tests/tooling/test_workflows.py, which fails when the two files drift apart.

app:
  - changed-files:
      - any-glob-to-any-file: ['dailies/**', 'data/ui/**', 'data/*.gschema.xml.in']

data:
  - changed-files:
      - any-glob-to-any-file:
          - 'data/v1/**'
          - 'scripts/popularity/**'
          - 'scripts/*submission*'
          - 'scripts/add_game.py'
          - 'scripts/check_links.py'

flatpak:
  - changed-files:
      - any-glob-to-any-file:
          - 'build-aux/**'
          - 'meson.build'
          - 'meson_options.txt'
          - 'data/*.metainfo.xml.in'
          - 'data/*.desktop.in'

ci:
  - changed-files:
      # CI gates, the scripts they run, and the agent instructions and settings.
      - any-glob-to-any-file: ['.github/**', 'scripts/**', '.claude/**', '.cursor/**', 'prompts/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']
